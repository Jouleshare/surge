<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy Policy — Surge</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#f8fafc; color:#0f172a; margin:0; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:32px; box-shadow:0 4px 20px rgba(15,23,42,0.06); }
    h1,h2,h3 { color:#0f172a; }
    p,li { line-height:1.75; color:#334155; }
    table { width:100%; border-collapse:collapse; margin:16px 0; }
    th,td { border:1px solid #e2e8f0; padding:12px; text-align:left; vertical-align:top; }
    th { background:#f8fafc; }
    a { color:#2563eb; }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="/">&larr; Back to Surge</a></p>
    <div class="card">{{ policy_html|safe }}</div>
  </div>
</body>
</html>
